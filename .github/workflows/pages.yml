name: Build and publish site

# Rebuilds the SQL analysis and the website, then publishes to GitHub Pages:
# on every push to main, after each monthly data download, and on demand.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Fetch Census trade data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the refund rules
        run: node --test tests/*.test.js
      - name: Run the SQL analysis and build the site
        run: |
          pip install duckdb
          python scripts/run_sql.py
          python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
